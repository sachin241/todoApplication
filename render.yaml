services:
  - type: web
    name: django-todo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn todo_project.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: RENDER_DEPLOYMENT
        value: production
      - key: DATABASE_ENGINE
        value: postgresql
      - key: DATABASE_URL
        sync: false

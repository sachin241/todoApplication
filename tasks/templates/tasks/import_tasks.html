{% extends 'base.html' %}
{% block content %}<div class="row justify-content-center"><div class="col-lg-7"><div class="card shadow-sm"><div class="card-body p-4"><h1 class="h3">Import tasks from Excel</h1><p class="text-secondary">Upload an <code>.xlsx</code> file with: Title, Description, Status, Priority, Due Date, Created At. Invalid rows are skipped.</p><form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.file }}{% for error in form.file.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}<div class="mt-3"><button class="btn btn-primary">Import tasks</button><a class="btn btn-outline-secondary" href="{% url 'tasks:list' %}">Cancel</a></div></form></div></div></div></div>{% endblock %}

{% extends 'base.html' %}
{% block content %}<div class="row justify-content-center"><div class="col-lg-8"><div class="card shadow-sm"><div class="card-body p-4"><h1 class="h3 mb-4">{{ page_title }}</h1><form method="post" novalidate>{% csrf_token %}{% for field in form %}<div class="mb-3"><label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}</div>{% endfor %}<div class="d-flex gap-2"><button class="btn btn-primary">Save task</button><a class="btn btn-outline-secondary" href="{% url 'tasks:list' %}">Cancel</a></div></form></div></div></div></div>{% endblock %}
